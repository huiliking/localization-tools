[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "button-classifier-mcp"
version = "0.1.0"
description = "MCP server for LLM-powered button classification using local Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name" }
]
keywords = ["mcp", "ollama", "button-classification", "web-automation", "localization"]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
button-classifier-mcp = "button_classifier.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/button_classifier"]
