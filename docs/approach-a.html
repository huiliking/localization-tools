    .banner-desc { opacity: .85; flex: 1; }

    .nav-cta { font-size: .9rem; color: #64748b; }

    .plan-name { font-size: 1.15rem; font-weight: 700; margin-bottom: .25rem; }
    .plan-price { font-size: 1.75rem; font-weight: 800; margin-bottom: .25rem; }
    .plan-price span { font-size: 1rem; font-weight: 400; color: #64748b; }
    .plan-desc { font-size: .875rem; color: #64748b; margin-bottom: 1rem; }
    .plan-card ul { list-style: none; margin-bottom: 1.25rem; }
    .plan-card li { font-size: .875rem; padding: .3rem 0; color: #334155; }
    .plan-card li::before { content: "✓ "; color: #22c55e; font-weight: 700; }

    .form-sub { color: #64748b; font-size: .9rem; margin-bottom: 1.75rem; }

    .field input, .field select { width: 100%; padding: .6rem .85rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: .9rem; font-family: inherit; color: #1e293b; background: #fff; }
    .field input:focus, .field select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .field-hint { font-size: .78rem; color: #6b7280; margin-top: .35rem; display: block; }
    .btn-submit { width: 100%; padding: .85rem; border-radius: 10px; border: none; background: #6366f1; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: .5rem; transition: background .15s; }
    .btn-submit:hover { background: #4338ca; }
    .terms { font-size: .78rem; color: #9ca3af; text-align: center; margin-top: 1rem; line-height: 1.6; }
    .terms a { color: #6366f1; text-decoration: none; }
    /* Social proof */
    .social-proof { text-align: center; padding: 2rem 0 3rem; }
    .trusted-by { font-size: .9rem; font-weight: 600; color: #64748b; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: .06em; font-size: .75rem; }
    .testimonials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    @media (max-width: 640px) { .testimonials { grid-template-columns: 1fr; } }
    blockquote { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; text-align: left; }
    blockquote p { font-size: .875rem; line-height: 1.6; color: #374151; margin-bottom: .75rem; font-style: italic; }
    blockquote cite { font-size: .78rem; color: #64748b; font-style: normal; font-weight: 600; }
    /* FAQ */
    .faq { max-width: 600px; margin: 0 auto 3rem; }
    .faq h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center; }
    .faq-item { border-bottom: 1px solid #e2e8f0; }
    .faq-q { width: 100%; text-align: left; background: none; border: none; padding: 1rem 0; font-size: .95rem; font-weight: 600; color: #1e293b; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-family: inherit; }
    .faq-q::after { content: "+"; font-size: 1.25rem; color: #6366f1; font-weight: 300; flex-shrink: 0; }

    /* Footer */

let lang = "en";

function t(key) { return locales[lang][key] || locales.en[key] || ""; }

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function render() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });
  // price + period
  document.getElementById("free-price").innerHTML = t("plan_free_price") + (t("plan_free_period") ? " <span>" + t("plan_free_period") + "</span>" : "");
  document.getElementById("pro-price").innerHTML = t("plan_pro_price") + (t("plan_pro_period") ? " <span>" + t("plan_pro_period") + "</span>" : "");
  document.getElementById("team-price").innerHTML = t("plan_team_price") + (t("plan_team_period") ? " <span>" + t("plan_team_period") + "</span>" : "");
}

function toggleFaq(btn) {
  const answer = btn.nextElementSibling;
  const isOpen = answer.style.display === "block";
  document.querySelectorAll(".faq-a").forEach(a => a.style.display = "none");
  document.querySelectorAll(".faq-q").forEach(b => b.classList.remove("open"));
  if (!isOpen) { answer.style.display = "block"; btn.classList.add("open"); }
}

render();
</script>
