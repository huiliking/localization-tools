const locales = { en: normalize(raw.en), es: normalize(raw.es), fr: normalize(raw.fr), de: normalize(raw.de), ja: normalize(raw.ja) };
let lang = "en";

function t(key) { return locales[lang][key] || locales.en[key] || ""; }

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function render() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });
  document.getElementById("free-price").textContent = t("plan_free_price");
  document.getElementById("pro-price").textContent = t("plan_pro_price");
  document.getElementById("team-price").textContent = t("plan_team_price");
}

function toggleFaq(btn) {
  const answer = btn.nextElementSibling;
  const isOpen = answer.style.display === "block";
  document.querySelectorAll(".faq-a").forEach(a => a.style.display = "none");
  document.querySelectorAll(".faq-q").forEach(b => b.classList.remove("open"));
  if (!isOpen) { answer.style.display = "block"; btn.classList.add("open"); }
}

render();
</script>
